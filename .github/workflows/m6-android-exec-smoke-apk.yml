name: M6 Android executable APK packaging smoke (offline)
on:
  workflow_dispatch:
  push:
    branches: [work/m5-linux-release]
    paths:
      - 'tests/m6/android-exec-smoke/**'
      - '.github/workflows/m6-android-exec-smoke-apk.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.1
          path: released-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: work/m5-linux-release
          path: harness
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: released-source/prototype/go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build original Android ARM64 executable, rename only for APK packaging
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C released-source rev-parse HEAD)" = c77cf2685623e71705ae38f57125986fb9531fd8
          dst="harness/tests/m6/android-exec-smoke/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$dst"
          (cd released-source/prototype && env CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -buildvcs=false \
            -ldflags='-s -w -X main.buildVersion=v1.0.1 -X main.buildCommit=c77cf2685623e71705ae38f57125986fb9531fd8' \
            -o "../../$dst/libtervonbridge.so" ./cmd/bridge)
          test -s "$dst/libtervonbridge.so"
          file "$dst/libtervonbridge.so"
          readelf -h "$dst/libtervonbridge.so" | grep -E 'Type:|Machine:'
          readelf -l "$dst/libtervonbridge.so" | grep '/system/bin/linker64'
          echo 'M6_ELF_READY_FOR_APK=PASS'
      - name: Build minimal test APK using only installed Android SDK (no Gradle dependencies)
        shell: bash
        run: |
          set -euo pipefail
          testproj="$PWD/harness/tests/m6/android-exec-smoke"
          build="$testproj/out"
          mkdir -p "$build/classes" "$build/dex" "$build/apkroot/lib/arm64-v8a"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          platform="$SDK/platforms/android-35/android.jar"
          buildtools="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$platform"
          test -x "$buildtools/aapt2"
          javac --release 8 -cp "$platform" -d "$build/classes" \
            "$testproj/app/src/main/java/org/tervon/bridge/smoketest/SmokeActivity.java"
          "$buildtools/d8" --lib "$platform" --min-api 26 --output "$build/dex" \
            "$build/classes/org/tervon/bridge/smoketest/SmokeActivity.class"
          "$buildtools/aapt2" link \
            -I "$platform" \
            --manifest "$testproj/app/src/main/AndroidManifest.xml" \
            --min-sdk-version 26 --target-sdk-version 35 \
            --version-code 1 --version-name 1.0 \
            -o "$build/unsigned.apk"
          cp "$build/dex/classes.dex" "$build/apkroot/"
          cp "$testproj/app/src/main/jniLibs/arm64-v8a/libtervonbridge.so" \
            "$build/apkroot/lib/arm64-v8a/libtervonbridge.so"
          (cd "$build/apkroot" && zip -q -0 "$build/unsigned.apk" classes.dex lib/arm64-v8a/libtervonbridge.so)
          "$buildtools/zipalign" -f -p 4 "$build/unsigned.apk" "$build/aligned.apk"
          keytool -genkeypair -noprompt -alias smoke \
            -keystore "$build/smoke-debug.jks" -storepass android -keypass android \
            -dname 'CN=Isolated Android Smoke APK' -keyalg RSA -keysize 2048 -validity 2
          "$buildtools/apksigner" sign --ks "$build/smoke-debug.jks" \
            --ks-key-alias smoke --ks-pass pass:android --key-pass pass:android \
            --out "$build/app-debug.apk" "$build/aligned.apk"
          "$buildtools/apksigner" verify "$build/app-debug.apk"
          echo 'M6_OFFLINE_APK_PACKAGING=PASS'
      - name: Verify APK actually includes unchanged executable bytes
        shell: bash
        run: |
          set -euo pipefail
          apk=harness/tests/m6/android-exec-smoke/out/app-debug.apk
          elf=harness/tests/m6/android-exec-smoke/app/src/main/jniLibs/arm64-v8a/libtervonbridge.so
          test -s "$apk"
          unzip -p "$apk" lib/arm64-v8a/libtervonbridge.so | cmp - "$elf"
          sha256sum "$apk" "$elf"
          echo 'M6_APK_PACKAGING_SHA_MATCH=PASS'
          echo 'M6_DEVICE_PROCESSBUILDER=NOT_TESTED_REQUIRE_PHYSICAL_ANDROID'
      - uses: actions/upload-artifact@v4
        with:
          name: m6-bridge-v1.0.1-android-exec-smoke-apk
          path: harness/tests/m6/android-exec-smoke/out/app-debug.apk
          if-no-files-found: error
          retention-days: 14
