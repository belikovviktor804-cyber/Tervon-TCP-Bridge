name: Go prototype checks
on:
  push:
    paths:
      - 'prototype/**'
      - 'integrations/stats/**'
      - 'tests/homeserver/verify-m1.sh'
      - 'tests/homeserver/deploy-m1-with-m0-backup.sh'
      - 'tests/homeserver/activate-m1-framing.py'
      - 'tests/homeserver/test_activate_m1_framing.py'
      - '.github/workflows/go-prototype.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - 'integrations/stats/**'
      - 'tests/homeserver/verify-m1.sh'
      - 'tests/homeserver/activate-m1-framing.py'
      - 'tests/homeserver/test_activate_m1_framing.py'
      - '.github/workflows/go-prototype.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototype/go.mod
          cache-dependency-path: prototype/go.mod
      - name: Report Go source formatting (non-blocking until cleanup)
        run: gofmt -l .
      - name: Check isolated M1 verification script syntax
        run: bash -n ../tests/homeserver/verify-m1.sh
      - name: Check guarded deployment script syntax
        run: bash -n ../tests/homeserver/deploy-m1-with-m0-backup.sh
      - name: Check isolated Bridge stats installer syntax (no deployment)
        run: bash -n ../integrations/stats/install-site-service.sh
      - name: Test guarded v2 activation helper (no systemd)
        run: python3 -m unittest discover -s ../tests/homeserver -p 'test_activate_m1_framing.py' -v
      - name: Install FastAPI for isolated dashboard route tests
        run: python3 -m pip install 'fastapi>=0.115,<1'
      - name: Test isolated stats collector (no production services)
        run: python3 -m unittest discover -s ../integrations/stats -p 'test_*.py' -v
      - name: Test stats panel JavaScript (Node built-ins only)
        run: |
          node --check ../integrations/stats/bridge_panel.js
          node --test ../integrations/stats/test_bridge_panel.cjs
      - name: Build all packages including CLI
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -count=1 -timeout=60s ./...
      - name: Race detector
        run: go test -race -count=1 -timeout=120s ./...
      - name: M1 repeated framing, cancellation and legacy regression
        run: go test -race -count=3 -timeout=180s -run 'TestFramed|TestLegacy|TestStream' ./...
      - name: M2 bounded padding policy regression
        run: go test -race -count=3 -timeout=60s ./padding
      - name: M2 repeated HTTP2 negotiation and byte-exact regression
        run: go test -race -count=3 -timeout=180s -run '^TestM2' .
      - name: M2 policy CPU/alloc benchmark (diagnostic, no pass threshold yet)
        run: go test -run '^
        run: go test -run '^
        run: go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz stream decoder (bounded)
        run: go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
 -fuzz '^FuzzPaddingDecoder
        run: go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz stream decoder (bounded)
        run: go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
 -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz frame parser (bounded)
        run: go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz stream decoder (bounded)
        run: go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
 -bench '^BenchmarkPaddingObserve
        run: go test -run '^
        run: go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz stream decoder (bounded)
        run: go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
 -fuzz '^FuzzPaddingDecoder
        run: go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz stream decoder (bounded)
        run: go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
 -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz frame parser (bounded)
        run: go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz stream decoder (bounded)
        run: go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
 -benchmem -benchtime=200ms ./padding
      - name: M2 fuzz padding decoder (bounded)
        run: go test -run '^
