name: Go prototype checks
on:
  push:
    paths:
      - 'prototype/**'
      - 'integrations/stats/**'
      - 'tests/homeserver/verify-m1.sh'
      - 'tests/homeserver/deploy-m1-with-m0-backup.sh'
      - 'tests/homeserver/activate-m1-framing.py'
      - 'tests/homeserver/test_activate_m1_framing.py'
      - 'tests/homeserver/collect_m2_baseline.py'
      - 'tests/homeserver/test_collect_m2_baseline.py'
      - 'tests/homeserver/stage-m3-candidate.sh'
      - 'tests/homeserver/m3-managed-tunnel-recovery.sh'
      - 'tests/homeserver/stage-m4-candidate.sh'
      - 'tests/homeserver/m4-live-preflight.sh'
      - 'tests/homeserver/m4-cutover-prepare.sh'
      - 'tests/homeserver/m4-cutover-switch.sh'
      - 'tests/homeserver/m3_passive_live_evidence.py'
      - 'tests/homeserver/test_m3_passive_live_evidence.py'
      - 'tests/homeserver/m4_mixed_diagnose.py'
      - 'tests/homeserver/test_m4_mixed_diagnose.py'
      - 'tests/homeserver/diagnose_m3_monitoring.py'
      - 'tests/homeserver/test_diagnose_m3_monitoring.py'
      - '.github/workflows/go-prototype.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - 'integrations/stats/**'
      - 'tests/homeserver/verify-m1.sh'
      - 'tests/homeserver/activate-m1-framing.py'
      - 'tests/homeserver/test_activate_m1_framing.py'
      - '.github/workflows/go-prototype.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototype/go.mod
          cache-dependency-path: prototype/go.mod
      - name: Report Go source formatting (non-blocking until cleanup)
        run: gofmt -l .
      - name: Check isolated M1 verification script syntax
        run: bash -n ../tests/homeserver/verify-m1.sh
      - name: Check M3 offline staging script syntax (no deployment)
        run: bash -n ../tests/homeserver/stage-m3-candidate.sh
      - name: Check explicit M4 binary-only switch safety invariants
        run: |
          bash -n ../tests/homeserver/m4-cutover-switch.sh
          grep -Fq 'M4_SWITCH=BACKUP_NOT_PREPARED' ../tests/homeserver/m4-cutover-switch.sh
          grep -Fq 'M4_SWITCH=PREPARED_HASH_MISMATCH' ../tests/homeserver/m4-cutover-switch.sh
          grep -Fq 'M4_AUTO_ROLLBACK=PASS' ../tests/homeserver/m4-cutover-switch.sh
          grep -Fq 'M4_INSTALL=PASS_PROCESS_AND_SHA' ../tests/homeserver/m4-cutover-switch.sh
          grep -Fq 'flock -n 9' ../tests/homeserver/m4-cutover-switch.sh
          ! grep -Eq 'systemctl[[:space:]]+(stop|disable|enable)' ../tests/homeserver/m4-cutover-switch.sh
      - name: Check M4 rollback preparation does not touch live services
        run: |
          bash -n ../tests/homeserver/m4-cutover-prepare.sh
          ! grep -Eq '^[[:space:]]*(systemctl[[:space:]]+(restart|stop|start|enable|disable)|service[[:space:]]|nginx[[:space:]]+-s)' ../tests/homeserver/m4-cutover-prepare.sh
      - name: Check M4 live deployment preflight is read-only
        run: |
          bash -n ../tests/homeserver/m4-live-preflight.sh
          ! grep -Eq '^[[:space:]]*(systemctl[[:space:]]+(restart|stop|start|enable|disable)|service[[:space:]]|nginx[[:space:]]+-s)' ../tests/homeserver/m4-live-preflight.sh
      - name: Check isolated M4 staging script syntax and no service commands
        run: |
          bash -n ../tests/homeserver/stage-m4-candidate.sh
          ! grep -Eq '^[[:space:]]*(systemctl|service|nginx)([[:space:]]|$)' ../tests/homeserver/stage-m4-candidate.sh
          # Detached systemd-run does not guarantee HOME or a Go build cache.
          grep -Fq 'export HOME="$STAGE/home"' ../tests/homeserver/stage-m4-candidate.sh
          grep -Fq 'export GOCACHE="$STAGE/cache/go-build"' ../tests/homeserver/stage-m4-candidate.sh
          grep -Fq 'export GOMODCACHE="$STAGE/cache/go-mod"' ../tests/homeserver/stage-m4-candidate.sh
          grep -Fq 'export TMPDIR="$STAGE/tmp"' ../tests/homeserver/stage-m4-candidate.sh
          # Confirm Go respects explicit cache with inherited HOME removed.
          env -u HOME -u GOCACHE -u XDG_CACHE_HOME -u TMPDIR bash -eu -c '
            stage=$(mktemp -d)
            trap '\''rm -rf "$stage"'\'' EXIT
            export HOME="$stage/home" XDG_CACHE_HOME="$stage/cache"
            export GOCACHE="$stage/cache/go-build" GOMODCACHE="$stage/cache/go-mod"
            export TMPDIR="$stage/tmp"
            mkdir -p "$HOME" "$GOCACHE" "$GOMODCACHE" "$TMPDIR"
            test "$(go env GOCACHE)" = "$GOCACHE"
            go env GOVERSION >/dev/null
          '
      - name: Check M3 tunnel-only recovery script syntax (no host action)
        run: bash -n ../tests/homeserver/m3-managed-tunnel-recovery.sh
      - name: Check guarded deployment script syntax
        run: bash -n ../tests/homeserver/deploy-m1-with-m0-backup.sh
      - name: Check isolated Bridge stats installer syntax (no deployment)
        run: bash -n ../integrations/stats/install-site-service.sh
      - name: Test guarded v2 activation helper (no systemd)
        run: python3 -m unittest discover -s ../tests/homeserver -p 'test_activate_m1_framing.py' -v
      - name: Test M2 read-only production baseline collector (mocked)
        run: python3 -m unittest discover -s ../tests/homeserver -p 'test_collect_m2_baseline.py' -v
      - name: Test M3 read-only monitoring chain diagnosis (mocked)
        run: python3 -m unittest discover -s ../tests/homeserver -p 'test_diagnose_m3_monitoring.py' -v
      - name: Test M3 passive public evidence sampler (mocked; no SSH)
        run: python3 -m unittest discover -s ../tests/homeserver -p 'test_m3_passive_live_evidence.py' -v
      - name: M4 short mixed-version telemetry diagnosis regression (offline)
        run: python3 -m unittest discover -s ../tests/homeserver -p 'test_m4_mixed_diagnose.py' -v
      - name: M3 repeated bounded jitter policy regression (race)
        run: go test -race -count=5 -timeout=90s ./jitter
      - name: M3 repeated opt-in jitter framing regression (race)
        run: go test -race -count=5 -timeout=90s -run '^TestJitter' ./framing
      - name: Install FastAPI for isolated dashboard route tests
        run: python3 -m pip install 'fastapi>=0.115,<1'
      - name: Test isolated stats collector (no production services)
        run: python3 -m unittest discover -s ../integrations/stats -p 'test_*.py' -v
      - name: Test stats panel JavaScript (Node built-ins only)
        run: |
          node --check ../integrations/stats/bridge_panel.js
          node --test ../integrations/stats/test_bridge_panel.cjs
      - name: Build all packages including CLI
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -count=1 -timeout=60s ./...
      - name: Race detector
        run: go test -race -count=1 -timeout=120s ./...
      - name: M1 repeated framing, cancellation and legacy regression
        run: go test -race -count=3 -timeout=180s -run 'TestFramed|TestLegacy|TestStream' ./...
      - name: M2 bounded padding policy regression
        run: go test -race -count=3 -timeout=60s ./padding
      - name: M2 repeated HTTP2 negotiation and byte-exact regression
        run: go test -race -count=3 -timeout=180s -run '^TestM2' .
      - name: M2 unmodified default-policy idle/resume repeated race regression
        run: go test -race -count=3 -v -timeout=180s -run '^TestM2DefaultPolicyIdleResume$' .
      - name: M2 repeated PAD session lifecycle and accounting (race)
        run: go test -race -count=3 -v -timeout=150s -run '^TestM2RepeatedSessionWaves$' .
      - name: M2 canceled-stream isolation repeated race regression
        run: go test -race -count=3 -v -timeout=120s -run '^TestM2CancelOneHTTP2StreamPreservesOtherSessions$' .
      - name: M2 concurrent HTTP2 PAD streams repeated race and resource diagnostics
        run: go test -race -count=3 -v -timeout=120s -run '^TestM2ConcurrentPaddingSessions$' .
      - name: M2 encrypted HTTP2/TLS byte accounting (diagnostic)
        run: go test -count=1 -v -run '^TestM2EncryptedHTTP2Accounting$' .
      - name: M2 HTTP2 latency and heap diagnostics (CI only)
        run: go test -count=1 -v -timeout=90s -run '^TestM2HTTP2LatencyAllocationDiagnostics$' .
      - name: M2 policy CPU/alloc benchmark (diagnostic, no pass threshold yet)
        run: go test -run '^$' -bench '^BenchmarkPaddingObserve$' -benchmem -benchtime=200ms ./padding
      - name: M2 comparative short and sustained encoding benchmarks
        run: go test -run '^$' -bench '^(BenchmarkShortFlowEncoding|BenchmarkSustainedFlowEncoding)$' -benchmem -benchtime=200ms ./framing
      - name: M2 fuzz padding decoder (bounded)
        run: go test -run '^$' -fuzz '^FuzzPaddingDecoder$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz frame parser (bounded)
        run: go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
      - name: M1 fuzz stream decoder (bounded)
        run: go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=15s -parallel=2 -timeout=90s ./framing
