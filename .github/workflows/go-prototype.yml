name: Go prototype checks
on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/go-prototype.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/go-prototype.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototype/go.mod
          cache-dependency-path: prototype/go.mod
      - name: Check Go source formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -count=1 -timeout=60s ./...
      - name: Race detector
        run: go test -race -count=1 -timeout=120s ./...
